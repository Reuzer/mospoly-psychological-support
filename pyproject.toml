[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "psychological-help-website"
version = "0.1.0"
description = "Psychological help website"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.135.4",
    "starlette==1.3.1",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy==2.0.35",
    "asyncpg==0.30.0",
    "pyjwt==2.15.1",
    "pydantic[email]>=2.0.0",
    # Security floor for the transitive email-validator dependency.
    "dnspython>=2.9.0,<3",
    "pydantic-extra-types",
    "phonenumbers",
    "httpx",
    "anyio>=4.14.2,<5",
    "greenlet",
    "bcrypt>=4.0.1",
    "alembic>=1.14.1",
    "psycopg2-binary>=2.9.10",
    "slowapi>=0.1.9",
    "python-multipart<0.0.32",
    "pillow>=13.0.0,<14"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.5",
    "pytest-asyncio",
]

[project.gui-scripts]
psychohelp = "psychohelp:main.main"

[tool.hatch.build.targets.wheel]
packages = [
    "psychohelp"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "module"
asyncio_mode = "auto"
